# Brand config for SEO template (from Q22)
brand:
  voice: ""
  usp_framework: ""
  trust_anchors: ""

# Data Sources Configuration
# Each source can be enabled/disabled and configured
# name: internal identifier (used in API source param)
# label: display name in UI
# description: tooltip/help text
# enabled: whether available in dropdown
# priority: sort order in dropdown (lower = higher priority)
data_sources:
  - name: "public"
    label: "Public (纯公开真实数据 - 默认推荐)"
    description: "零登录、零 Cookie、只爬公开前台页面 (Amazon搜索/详情页 + Google Suggest/Trends + Reddit), 真实可信"
    enabled: true
    priority: 10
  - name: "real"
    label: "Real (聚合真实数据源: Amazon+Google+批发)"
    description: "在 Public 基础上增加批发报价聚合 (AliExpress/Alibaba/Keepa 等，需住宅代理)"
    enabled: true
    priority: 20
  - name: "mock"
    label: "Mock (仅测试用假数据)"
    description: "仅用于管线验证，绝不用于真实选品"
    enabled: true
    priority: 99