[project]
name = "product-sourcing"
version = "0.1.0"
description = "Automated product sourcing pipeline for SEO/GEO-driven Shopify stores"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pytrends",
    "playwright",
    "notion-client",
    "shopify-python-api",
    "python-dotenv",
    "pyyaml",
    "jinja2",
    "pydantic",
    "pydantic-settings",
    "httpx",
    "tenacity",
    "rich",
    "typer",
    "sqlite-utils",
    "fastapi",
    "uvicorn",
    "pandas",
    "python-multipart",
    "feedparser",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "pytest-mock",
    "ruff",
    "mypy",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sourcing"]