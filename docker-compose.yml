  #     /bin/sh -c "
  #       echo '0 2 * * * cd /app && uv run python -m sourcing fetch \"portable neck massager\" --source real --limit 10' > /etc/crontab &&
  #       echo '0 4 * * * cd /app && uv run python -m sourcing healthcheck --days 30' >> /etc/crontab &&
  #       cron -f
  #     "
  #   restart: unless-stopped